name: Convert HTML to APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      html_content:
        description: 'HTML Content'
        required: true
        default: '<h1>Hello World</h1>'
      app_name:
        description: 'App Name'
        required: true
        default: 'MyConvertedApp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.example.convertedapp "${{ github.event.inputs.app_name || 'ConvertedApp' }}"
          cd myApp
          cordova platform add android

      - name: Inject HTML Content
        run: |
          echo '${{ github.event.inputs.html_content || github.event.client_payload.html_content }}' > myApp/www/index.html

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: converted-apk
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
